[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jingu"
version = "0.1.0"
description = "Minimal Jingu Xiang-Ye runtime kernel"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
jingu = "jingu.cli:main"

[tool.setuptools.packages.find]
include = ["jingu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
